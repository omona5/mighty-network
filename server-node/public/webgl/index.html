<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <base href="/webgl/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>mighty-network-unity</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #231f20; }
    #unity-canvas { display: block; width: 100%; height: 100%; }
    #status { position: fixed; inset: 45% 10% auto; text-align: center; color: white; font: 16px sans-serif; }
    #status progress { display: block; width: min(420px, 100%); height: 14px; margin: 16px auto; accent-color: #d8b77b; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="status">Loading…</div>
  <script src="loading.js"></script>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const status = document.getElementById('status');
    const config = {
      dataUrl: 'Build/webgl.data',
      frameworkUrl: 'Build/webgl.framework.js',
      codeUrl: 'Build/webgl.wasm',
      streamingAssetsUrl: new URL('StreamingAssets', document.baseURI).href,
      companyName: "DefaultCompany",
      productName: "mighty-network-unity",
      productVersion: "1.0",
      matchWebGLToCanvasSize: true
    };
    MightyLoading.start(canvas, status, config, 'Build/webgl.loader.js');
  </script>
</body>
</html>
