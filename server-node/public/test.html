<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mighty 서버 테스트 (WebSocket)</title>
    <style>
      body {
        font-family: -apple-system, sans-serif;
        max-width: 640px;
        margin: 30px auto;
        padding: 0 20px;
        background: #1a1a2e;
        color: #eee;
      }
      h1 { font-size: 20px; }
      .box { padding: 12px; border-radius: 8px; background: #16213e; margin: 10px 0; }
      input {
        font-size: 15px; padding: 8px; border-radius: 6px; border: none;
        margin: 4px 4px 4px 0; width: 160px;
      }
      button {
        font-size: 15px; padding: 8px 16px; border: none; border-radius: 6px;
        background: #0f3460; color: #fff; cursor: pointer; margin: 4px 4px 4px 0;
      }
      button:hover { background: #533483; }
      #players li { margin: 4px 0; }
      #log {
        margin-top: 10px; padding: 10px; background: #0f1626; border-radius: 8px;
        height: 160px; overflow-y: auto; font-family: monospace; font-size: 12px;
        white-space: pre-wrap;
      }
      .hidden { display: none; }
      .roomcode { font-size: 24px; letter-spacing: 4px; color: #ffd166; }
      #hand, #table { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; min-height: 62px; }
      #table { background: #0f1626; border-radius: 8px; padding: 6px; }
      .card {
        width: 42px; height: 60px; border-radius: 6px; background: #fff;
        display: flex; align-items: center; justify-content: center;
        font-size: 15px; font-weight: bold; color: #111;
      }
      .card.red { color: #d00; }
      .card.joker { background: #333; color: #ffd166; font-size: 11px; }
      #hand.myturn .card { cursor: pointer; }
      #hand.myturn .card:hover { outline: 3px solid #ffd166; transform: translateY(-4px); }
      #hand .card { cursor: pointer; }
      #hand .card.selected { outline: 3px solid #06d6a0; transform: translateY(-6px); background: #e8fff5; }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      .tcard { position: relative; }
      .tcard .who {
        position: absolute; top: -16px; left: 0; right: 0; text-align: center;
        font-size: 10px; color: #9ad; white-space: nowrap;
      }
      #turnInfo { font-weight: bold; color: #ffd166; margin-top: 6px; }
    </style>
  </head>
  <body>
    <h1>Mighty 서버 테스트 (WebSocket)</h1>
    <div class="box" id="status">연결 상태: 대기 중...</div>

    <!-- 방 입장 전 화면 -->
    <div class="box" id="lobby">
      <div>
        <input id="nickname" placeholder="닉네임" maxlength="12" />
      </div>
      <div>
        <input id="roomId" placeholder="방 코드 (입장 시)" maxlength="4" />
        <input id="password" placeholder="비밀번호 (선택)" />
      </div>
      <div>
        <button id="createBtn">방 만들기</button>
        <button id="joinBtn">입장</button>
      </div>
    </div>

    <!-- 방 입장 후 화면 -->
    <div class="box hidden" id="room">
      <div>방 코드: <span class="roomcode" id="roomCodeView"></span>
        (상태: <span id="roomStatus"></span>)</div>
      <div>플레이어 (<span id="playerCount">0</span>/5):</div>
      <ul id="players"></ul>
      <div id="startedBanner" class="hidden" style="color:#06d6a0;font-weight:bold;">게임이 시작되었습니다!</div>

      <!-- 입찰 단계 -->
      <div id="bidArea" class="hidden" style="background:#0f1626;border-radius:8px;padding:8px;margin:8px 0;">
        <div id="bidStatus" style="color:#ffd166;"></div>
        <div id="bidControls" class="hidden">
          공약:
          <input id="bidScore" type="number" min="13" max="20" value="13" style="width:60px;" />
          기루다:
          <select id="bidTrump" style="width:110px;">
            <option value="SPADE">♠ 스페이드</option>
            <option value="HEART">♥ 하트</option>
            <option value="DIAMOND">♦ 다이아</option>
            <option value="CLUB">♣ 클로버</option>
            <option value="NT">노기루</option>
          </select>
          <button id="bidBtn">공약</button>
          <button id="passBidBtn">패스</button>
        </div>
        <button id="dealMissBtn" class="hidden" style="margin-top:6px;background:#ef476f;">딜미스 (손패≤0.5점 · 다시 돌리기)</button>
      </div>

      <!-- 바닥패 교환 (주공만) -->
      <div id="kittyArea" class="hidden" style="background:#0f1626;border-radius:8px;padding:8px;margin:8px 0;">
        <div style="color:#ffd166;">바닥패를 받았습니다. 버릴 카드 3장을 고르세요 (주공)</div>
        <div id="kittyHint" style="color:#9ad;margin:4px 0;">선택: 0/3</div>
        <button id="discardKittyBtn" disabled>3장 버리기</button>
      </div>

      <!-- 프렌드 선택 단계 (주공만) -->
      <div id="friendArea" class="hidden" style="background:#0f1626;border-radius:8px;padding:8px;margin:8px 0;">
        <div style="color:#ffd166;">프렌드를 지정하세요 (주공)</div>
        <div style="margin:6px 0;">
          <button id="friendMightyBtn">마이티 프렌드</button>
          <button id="friendJokerBtn">조커 프렌드</button>
          <button id="friendNoneBtn">노프렌드</button>
        </div>
        <div style="margin:6px 0;">
          카드:
          <input id="friendCard" placeholder="예: S_A" style="width:110px;" />
          <button id="friendCustomBtn">카드 지정</button>
        </div>
        <div style="margin:6px 0;">플레이어 프렌드 (즉시 공개):</div>
        <div id="friendPlayers"></div>
      </div>

      <!-- 결과 화면 -->
      <div id="resultArea" class="hidden" style="background:#0f1626;border-radius:8px;padding:10px;margin:8px 0;">
        <div id="resultTitle" style="color:#06d6a0;font-weight:bold;font-size:1.1em;"></div>
        <div id="resultBody" style="margin-top:6px;"></div>
        <button id="lobbyBtn" style="margin-top:8px;">대기방으로 돌아가기</button>
      </div>

      <div id="tableArea" class="hidden">
        <div id="ruleInfo" style="color:#9ad;"></div>
        <div id="turnInfo"></div>
        <div id="trickWinner" style="color:#06d6a0;"></div>
        <div id="leadExtra" style="color:#ffd166;margin:4px 0;"></div>
        <div>테이블에 낸 카드:</div>
        <div id="table"></div>
        <div id="playChoice" class="hidden" style="background:#0f1626;border-radius:8px;padding:8px;margin:8px 0;">
          <div id="playChoiceHint" style="color:#ffd166;margin-bottom:6px;"></div>
          <div id="playChoiceBtns"></div>
        </div>
      </div>
      <div id="handArea" class="hidden">
        <div>내 손패 (<span id="handCount">0</span>장):</div>
        <div id="hand"></div>
      </div>
      <button id="readyBtn">준비 / 준비취소</button>
      <button id="startBtn" class="hidden">게임 시작 (방장)</button>
      <button id="shuffleSeatsBtn" class="hidden" style="background:#118ab2;">자리 섞기 (방장)</button>
      <button id="resetScoresBtn" class="hidden" style="background:#ef476f;">점수 초기화 (방장)</button>
      <button id="pingBtn">Ping</button>
      <button id="leaveBtn">방 나가기</button>
    </div>

    <div id="log"></div>

    <script>
      const $ = (id) => document.getElementById(id);
      function log(msg) {
        $("log").textContent += msg + "\n";
        $("log").scrollTop = $("log").scrollHeight;
      }

      let socket = null;
      let myToken = null;
      let myClientId = null;
      let latestState = null; // 최근 game_state (내 차례 판정용)
      let myCanDealMiss = false; // 딜미스 선언 가능 여부(your_hand로 수신)
      let discardSelected = []; // 바닥패 버리기 선택 id 목록
      let myHandCards = [];
      let intentionalLeave = false;
      let reconnectTimer = null;
      let reconnectAttempt = 0;
      let pendingPlayCardId = null; // 조커/조커콜 리드 대기

      function bindSocket(ws) {
        socket = ws;
        ws.addEventListener("open", () => {
          $("status").textContent = "연결 상태: 접속됨";
          log("[open] 접속됨");
          reconnectAttempt = 0;
          // 저장된 토큰이 있으면 자동 재접속
          if (myToken && !intentionalLeave) {
            log("[reconnect] 토큰으로 재접속 요청");
            sendMsg("reconnect", { reconnectToken: myToken });
          }
        });
        ws.addEventListener("close", () => {
          $("status").textContent = "연결 상태: 끊김";
          log("[close] 끊김");
          if (intentionalLeave) return;
          if (!myToken) return;
          $("status").textContent = "연결 상태: 재접속 중... (봇이 대신 플레이)";
          scheduleReconnect();
        });
        ws.addEventListener("error", () => log("[error] 연결 오류"));
        ws.addEventListener("message", (event) => {
          const msg = JSON.parse(event.data);
          switch (msg.type) {
          case "welcome":
            myClientId = msg.data.clientId;
            log("[welcome] 내 id: " + myClientId);
            break;
          case "pong_from_server":
            log("[pong] " + JSON.stringify(msg.data));
            break;
          case "game_started":
            log("[game_started] 게임 시작!");
            $("startedBanner").classList.remove("hidden");
            break;
          case "your_hand":
            log("[your_hand] " + msg.data.cards.length + "장 받음");
            myHandCards = msg.data.cards || [];
            discardSelected = [];
            renderHand(msg.data.cards);
            myCanDealMiss = !!msg.data.canDealMiss;
            updateDealMissBtn();
            updateDiscardUi();
            break;
          case "kitty_discarded":
            log("[kitty_discarded] 바닥패 버리기 완료");
            discardSelected = [];
            break;
          case "deal_miss":
            log("[deal_miss] " + msg.data.nickname + " 딜미스 → 다시 돌립니다");
            break;
          case "bid_lowered":
            log("[bid_lowered] 전원 패스 → 최소공약 " + msg.data.minBid + "로 낮춰 재입찰");
            break;
          case "bid_result":
            log("[bid_result] 주공 " + msg.data.declarerNickname + " / 공약 " + msg.data.targetScore);
            break;
          case "friend_chosen":
            log("[friend_chosen] 프렌드 지정 완료");
            break;
          case "scores_reset":
            log("[scores_reset] 누적 점수가 초기화되었습니다");
            break;
          case "seats_shuffled":
            log("[seats_shuffled] 자리가 섞였습니다");
            break;
          case "reconnected":
            myClientId = msg.data.clientId;
            myToken = msg.data.reconnectToken || myToken;
            log("[reconnected] 복구됨 room=" + msg.data.roomId + " id=" + myClientId);
            enterRoomView(msg.data.roomId);
            break;
          case "reconnect_failed":
            log("[reconnect_failed] " + msg.data.message);
            myToken = null;
            intentionalLeave = false;
            exitRoomView();
            break;
          case "room_created":
            myToken = msg.data.reconnectToken;
            intentionalLeave = false;
            log("[room_created] 방 코드 " + msg.data.roomId);
            enterRoomView(msg.data.roomId);
            break;
          case "room_joined":
            myToken = msg.data.reconnectToken;
            intentionalLeave = false;
            log("[room_joined] 방 코드 " + msg.data.roomId);
            enterRoomView(msg.data.roomId);
            break;
          case "game_state":
            renderState(msg.data);
            break;
          case "game_finished":
            log("[game_finished] 승: " + msg.data.winnerLabel
              + " 주공팀 " + msg.data.declarerTeamScore + " / 목표 " + msg.data.targetScore
              + (msg.data.isRun ? " ★런" : "")
              + (msg.data.isBackrun ? " ★백런" : "")
              + " ×" + (msg.data.multiplier || 1));
            renderResult(msg.data);
            break;
          case "error_message":
            log("[error_message] " + msg.data.message);
            alert(msg.data.message);
            break;
          default:
            log("[recv] " + event.data);
          }
        });
      }

      function scheduleReconnect() {
        if (reconnectTimer) return;
        const delay = Math.min(1000 * Math.pow(2, reconnectAttempt), 10000);
        reconnectAttempt++;
        log("[reconnect] " + delay + "ms 후 재시도 (#" + reconnectAttempt + ")");
        reconnectTimer = setTimeout(() => {
          reconnectTimer = null;
          connectSocket();
        }, delay);
      }

      function connectSocket() {
        const ws = new WebSocket("ws://" + location.host);
        bindSocket(ws);
      }

      connectSocket();

      function sendMsg(type, data) {
        if (!socket || socket.readyState !== WebSocket.OPEN) {
          log("[send] 소켓이 아직 열리지 않음");
          return;
        }
        socket.send(JSON.stringify({ type, data }));
      }

      // 뒤로가기/탭닫기 시 소켓을 즉시 닫아 서버가 바로 soft-disconnect 하도록
      function forceCloseSocket() {
        if (!socket) return;
        try {
          if (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING) {
            socket.close();
          }
        } catch (e) { /* ignore */ }
      }
      window.addEventListener("pagehide", forceCloseSocket);
      window.addEventListener("beforeunload", forceCloseSocket);

      // 아래는 UI 헬퍼

      function enterRoomView(roomId) {
        $("lobby").classList.add("hidden");
        $("room").classList.remove("hidden");
        $("roomCodeView").textContent = roomId;
      }
      function exitRoomView() {
        latestState = null;
        $("room").classList.add("hidden");
        $("lobby").classList.remove("hidden");
        $("players").innerHTML = "";
        $("handArea").classList.add("hidden");
        $("hand").innerHTML = "";
        $("tableArea").classList.add("hidden");
        $("table").innerHTML = "";
        $("bidArea").classList.add("hidden");
        $("friendArea").classList.add("hidden");
        $("resultArea").classList.add("hidden");
        $("kittyArea").classList.add("hidden");
        myCanDealMiss = false;
        discardSelected = [];
      }
      // 무늬 기호와 색상
      const SUIT_SYMBOL = { SPADE: "♠", HEART: "♥", DIAMOND: "♦", CLUB: "♣" };
      // 카드 한 장 DOM 생성 (공통)
      function makeCardEl(c) {
        const div = document.createElement("div");
        div.className = "card";
        if (c.suit === "JOKER") {
          div.classList.add("joker");
          div.textContent = "JOKER";
        } else {
          if (c.suit === "HEART" || c.suit === "DIAMOND") div.classList.add("red");
          div.textContent = SUIT_SYMBOL[c.suit] + c.rank;
        }
        return div;
      }
      function renderHand(cards) {
        const list = sortHandClient(cards || []);
        myHandCards = list;
        $("handArea").classList.remove("hidden");
        $("handCount").textContent = list.length;
        const hand = $("hand");
        hand.innerHTML = "";
        list.forEach((c) => {
          const div = makeCardEl(c);
          if (discardSelected.includes(c.id)) div.classList.add("selected");
          div.addEventListener("click", () => onCardClick(c));
          hand.appendChild(div);
        });
      }
      // ♠→♥→♦→♣→조커, 같은 무늬는 A>...>2
      function sortHandClient(cards) {
        const suitOrder = { SPADE: 0, HEART: 1, DIAMOND: 2, CLUB: 3, JOKER: 4 };
        const rankOrder = { "2":0,"3":1,"4":2,"5":3,"6":4,"7":5,"8":6,"9":7,"10":8,J:9,Q:10,K:11,A:12,JOKER:13 };
        return cards.slice().sort((a, b) => {
          const sa = suitOrder[a.suit] != null ? suitOrder[a.suit] : 9;
          const sb = suitOrder[b.suit] != null ? suitOrder[b.suit] : 9;
          if (sa !== sb) return sa - sb;
          return (rankOrder[b.rank] || 0) - (rankOrder[a.rank] || 0);
        });
      }
      function onCardClick(card) {
        if (!latestState) return;
        // 바닥패 교환: 카드 선택 토글
        if (latestState.status === "exchanging_kitty"
            && latestState.declarerClientId === myClientId) {
          const i = discardSelected.indexOf(card.id);
          if (i >= 0) discardSelected.splice(i, 1);
          else if (discardSelected.length < 3) discardSelected.push(card.id);
          renderHand(myHandCards);
          updateDiscardUi();
          return;
        }
        if (latestState.status !== "playing") return;
        if (latestState.currentTurnClientId !== myClientId) {
          log("아직 내 차례가 아닙니다. (현재: " + latestState.currentTurnNickname + ")");
          return;
        }
        beginPlayCard(card.id);
      }
      function isMyLeadTurn() {
        if (!latestState || latestState.currentTurnClientId !== myClientId) return false;
        const t = latestState.tableCards || [];
        return t.length === 0 || t.length >= 5;
      }
      function clearPlayChoice() {
        pendingPlayCardId = null;
        const box = $("playChoice");
        if (box) box.classList.add("hidden");
      }
      function beginPlayCard(cardId) {
        clearPlayChoice();
        if (isMyLeadTurn()) {
          if (cardId === "JOKER") {
            pendingPlayCardId = cardId;
            showSuitChoice();
            log("[play] 조커 리드 — 따라낼 무늬를 선택하세요");
            return;
          }
          if (latestState.jokerCallCardId && cardId === latestState.jokerCallCardId) {
            pendingPlayCardId = cardId;
            showJokerCallChoice();
            log("[play] 조커콜 카드 — 조커콜 사용 여부를 선택하세요");
            return;
          }
        }
        sendPlayCard(cardId);
      }
      function showSuitChoice() {
        $("playChoice").classList.remove("hidden");
        $("playChoiceHint").textContent = "조커 리드 — 따라낼 무늬 선택:";
        const btns = $("playChoiceBtns");
        btns.innerHTML = "";
        [
          ["SPADE", "♠ S"], ["HEART", "♥ H"], ["DIAMOND", "♦ D"], ["CLUB", "♣ C"]
        ].forEach(([suit, label]) => {
          const b = document.createElement("button");
          b.textContent = label;
          b.onclick = () => sendPlayCard(pendingPlayCardId, { declaredSuit: suit });
          btns.appendChild(b);
        });
        const cancel = document.createElement("button");
        cancel.textContent = "취소";
        cancel.onclick = () => clearPlayChoice();
        btns.appendChild(cancel);
      }
      function showJokerCallChoice() {
        $("playChoice").classList.remove("hidden");
        $("playChoiceHint").textContent = "조커콜을 사용할까요?";
        const btns = $("playChoiceBtns");
        btns.innerHTML = "";
        const use = document.createElement("button");
        use.textContent = "조커콜 사용";
        use.style.background = "#ef476f";
        use.onclick = () => sendPlayCard(pendingPlayCardId, { activateJokerCall: true });
        btns.appendChild(use);
        const plain = document.createElement("button");
        plain.textContent = "일반으로 내기";
        plain.onclick = () => sendPlayCard(pendingPlayCardId, { activateJokerCall: false });
        btns.appendChild(plain);
        const cancel = document.createElement("button");
        cancel.textContent = "취소";
        cancel.onclick = () => clearPlayChoice();
        btns.appendChild(cancel);
      }
      function sendPlayCard(cardId, opts) {
        const data = Object.assign({ cardId }, opts || {});
        sendMsg("play_card", data);
        log("[play_card] 전송: " + cardId
          + (data.declaredSuit ? " suit=" + data.declaredSuit : "")
          + (data.activateJokerCall ? " [조커콜]" : ""));
        clearPlayChoice();
      }
      function updateDiscardUi() {
        const exchanging = latestState && latestState.status === "exchanging_kitty"
          && latestState.declarerClientId === myClientId;
        $("kittyArea").classList.toggle("hidden", !exchanging);
        if (exchanging) {
          $("kittyHint").textContent = "선택: " + discardSelected.length + "/3"
            + (discardSelected.length ? " [" + discardSelected.join(", ") + "]" : "");
          $("discardKittyBtn").disabled = discardSelected.length !== 3;
        }
      }
      function renderKitty(state) {
        updateDiscardUi();
        if (state.status === "exchanging_kitty" && state.declarerClientId !== myClientId) {
          // 비주공: 손패 위에 대기 안내를 위해 kittyArea는 숨김
          $("kittyArea").classList.add("hidden");
        }
      }
      // 무늬 기호 / 카드 id를 짧게
      function suitSym(s) { return SUIT_SYMBOL[s] || (s ? s : "노기루"); }
      function cardShort(id) {
        if (!id) return "-";
        if (id === "JOKER") return "조커";
        const [s, r] = id.split("_");
        const m = { S: "♠", H: "♥", D: "♦", C: "♣" };
        return (m[s] || s) + r;
      }
      function renderBidding(state) {
        const bidding = state.status === "bidding";
        $("bidArea").classList.toggle("hidden", !bidding);
        if (bidding) {
          const hi = state.highestBid
            ? `최고공약: ${state.highestBid.nickname} ${state.highestBid.targetScore} ${state.highestBid.noTrump ? "노기루" : suitSym(state.highestBid.trumpSuit)}`
            : "아직 공약 없음";
          const myBidTurn = state.currentBidderClientId === myClientId;
          const minBid = state.minBid || 13;
          const raiseMin = state.nextMinBid
            || (state.highestBid ? state.highestBid.targetScore + 1 : minBid);
          $("bidStatus").textContent = `입찰 차례: ${state.currentBidderNickname || "-"}`
            + (myBidTurn ? "  << 내 차례! (올리거나 패스)" : "")
            + `  |  바닥최소 ${minBid}`
            + (state.highestBid ? `  |  올릴최소 ${raiseMin}` : "")
            + `  |  ` + hi;
          $("bidControls").classList.toggle("hidden", !myBidTurn);
          const scoreInput = $("bidScore");
          scoreInput.min = raiseMin;
          if (myBidTurn && (scoreInput.value === "" || parseInt(scoreInput.value, 10) < raiseMin)) {
            scoreInput.value = raiseMin;
          }
        }
        updateDealMissBtn();
      }
      function updateDealMissBtn() {
        const show = latestState && latestState.status === "bidding" && myCanDealMiss;
        $("dealMissBtn").classList.toggle("hidden", !show);
      }
      function renderFriend(state) {
        const choosing = state.status === "choosing_friend";
        const iAmDeclarer = state.declarerClientId === myClientId;
        $("friendArea").classList.toggle("hidden", !(choosing && iAmDeclarer));
        if (choosing && iAmDeclarer) {
          const box = $("friendPlayers");
          box.innerHTML = "";
          (state.players || []).forEach((p) => {
            if (p.clientId === state.declarerClientId) return; // 주공 자신 제외
            const btn = document.createElement("button");
            btn.textContent = (p.isBot ? "[봇] " : "") + p.nickname;
            btn.style.marginRight = "6px";
            btn.addEventListener("click", () =>
              sendMsg("choose_friend", { friendClientId: p.clientId }));
            box.appendChild(btn);
          });
        }
      }
      function friendDeclLabel(cardId, mightyId) {
        if (!cardId) return "카드 프렌드";
        if (cardId === "JOKER") return "조커 프렌드";
        if (mightyId && cardId === mightyId) return "마이티 프렌드 (" + cardShort(cardId) + ")";
        return cardShort(cardId) + " 프렌드";
      }
      function renderResult(r) {
        $("resultArea").classList.remove("hidden");
        let title = "승자: " + r.winnerLabel;
        if (r.isRun) title += " ★런";
        if (r.isBackrun) title += " ★백런";
        $("resultTitle").textContent = title;
        const teamLine = (arr) => (arr || []).map((p) => p.nickname + " " + p.score + "점").join(", ");
        const multTags = (r.multipliers && r.multipliers.length)
          ? r.multipliers.join(" + ") : "";
        $("resultBody").innerHTML =
          "<b>주공팀 목표였던 점수: " + r.targetScore + "점</b>"
          + "<br>주공: " + (r.declarerNickname || "-")
          + (r.friendNickname ? (" + 프렌드 " + r.friendNickname) : " (단독)")
          + "<br>결과 — 주공팀 " + r.declarerTeamScore + "점"
          + " | 수비팀 " + r.defenderTeamScore + "점"
          + " | 바닥패 " + r.kittyScore + "점"
          + "<br>" + (r.winner === "declarer"
            ? "(목표 " + r.targetScore + "점 달성)"
            : "(목표 " + r.targetScore + "점까지 " + Math.max(0, r.targetScore - r.declarerTeamScore) + "점 부족)")
          + (r.isRun ? "<br><b style=\"color:#ffd166;\">★ 런! (주공팀 20점 전부)</b>" : "")
          + (r.isBackrun ? "<br><b style=\"color:#ef476f;\">★ 백런! (주공팀 10점 이하)</b>" : "")
          + "<br>배수: ×" + (r.multiplier || 1)
          + (multTags ? (" (" + multTags + ")") : "")
          + "<br>정산 단위: " + (r.stakeBase || 0) + " × " + (r.multiplier || 1) + " = " + (r.stakeTotal || 0)
          + "<br><b>이번 판 정산 / 누적 스코어</b><br>"
          + (r.scoreboard || []).map((p) =>
              (p.isBot ? "[봇] " : "") + p.nickname
              + ": " + (p.delta >= 0 ? "+" : "") + p.delta
              + " → 누적 " + p.sessionScore
            ).join("<br>")
          + "<br>주공팀: " + teamLine(r.declarerTeam)
          + "<br>수비팀: " + teamLine(r.defenderTeam);
      }
      function renderTable(state) {
        renderBidding(state);
        renderKitty(state);
        renderFriend(state);
        const finished = state.status === "finished";
        const playing = state.status === "playing";
        $("resultArea").classList.toggle("hidden", !finished);
        if (finished && state.lastResult) renderResult(state.lastResult);
        $("tableArea").classList.toggle("hidden", !playing);
        // 룰 정보
        let friendTxt = "";
        if (state.friendChosen) {
          if (state.friendType === "none") friendTxt = "프렌드: 없음(노프렌드)";
          else if (state.friendType === "player")
            friendTxt = "프렌드: " + (state.friendNickname || "-") + " (플레이어)";
          else {
            // 카드 프렌드: 선언 카드는 공개, 소유자는 카드가 나오기 전까지 비공개
            const decl = friendDeclLabel(state.friendCardId, state.mightyCardId);
            friendTxt = state.friendRevealed
              ? ("프렌드: " + decl + " → " + (state.friendNickname || "-"))
              : ("프렌드: " + decl + " (소유자 비공개)");
          }
        }
        $("ruleInfo").innerHTML = playing
          ? ("주공: " + (state.declarerNickname || "-")
             + (state.friendRevealed && state.friendNickname ? (" + " + state.friendNickname) : "")
             + "<br><b style=\"color:#ffd166;\">★ 주공팀 승리 조건: " + (state.targetScore || "-") + "점 이상"
             + "  (현재 " + (state.declarerTeamScore || 0) + "점"
             + " / 앞으로 " + (state.pointsNeeded != null ? state.pointsNeeded : "-") + "점)</b>"
             + "<br>수비팀 현재 " + (state.defenderTeamScore || 0) + "점"
             + "  |  바닥패 " + (state.kittyScore || 0) + "점 포함"
             + "<br>기루다: " + (state.noTrump ? "노기루" : suitSym(state.trumpSuit))
             + "  |  마이티: " + cardShort(state.mightyCardId)
             + "  |  조커콜: " + cardShort(state.jokerCallCardId)
             + "  |  트릭 " + state.trickNumber + "/10"
             + (friendTxt ? ("<br>" + friendTxt) : ""))
          : "";
        // 현재 차례 표시
        const myTurn = state.currentTurnClientId === myClientId;
        $("turnInfo").textContent = playing
          ? ("현재 차례: " + (state.currentTurnNickname || "-") + (myTurn ? "  << 내 차례! (카드 클릭)" : ""))
          : "";
        // 직전 트릭 승자
        $("trickWinner").textContent = (playing && state.lastTrickWinnerNickname)
          ? ("직전 트릭 승자: " + state.lastTrickWinnerNickname) : "";
        // 리드 부가정보
        const leadExtra = $("leadExtra");
        if (playing && state.tableCards && state.tableCards.length > 0) {
          const lead = state.tableCards[0];
          const parts = [];
          if (lead.card && lead.card.id === "JOKER" && lead.declaredSuit)
            parts.push("조커 리드 무늬: " + suitSym(lead.declaredSuit));
          if (lead.jokerCallActivated) parts.push("★ 조커콜 활성! (조커 강제)");
          leadExtra.textContent = parts.join("  |  ");
        } else {
          leadExtra.textContent = "";
        }
        // 내 차례일 때만 손패를 클릭 가능하게 강조
        $("hand").classList.toggle("myturn", playing && myTurn);
        // 테이블에 낸 카드들
        const table = $("table");
        table.innerHTML = "";
        (state.tableCards || []).forEach((t) => {
          const el = makeCardEl(t.card);
          el.classList.add("tcard");
          const who = document.createElement("div");
          who.className = "who";
          who.textContent = t.playerNickname;
          el.appendChild(who);
          table.appendChild(el);
        });
      }
      function formatReconnectRemain(p, state) {
        if (p.connected || p.isBot) return "";
        const grace = (state && state.reconnectGraceMs) || (5 * 60 * 1000);
        const expires = p.reconnectExpiresAt
          || (p.disconnectedAt ? p.disconnectedAt + grace : 0);
        if (!expires) return " (연결끊김·봇대타)";
        const remainMs = Math.max(0, expires - Date.now());
        const sec = Math.ceil(remainMs / 1000);
        const mm = String(Math.floor(sec / 60)).padStart(2, "0");
        const ss = String(sec % 60).padStart(2, "0");
        return " (연결끊김·봇대타 " + mm + ":" + ss + ")";
      }

      function renderPlayerList(state) {
        if (!state || !state.players) return;
        $("players").innerHTML = "";
        state.players.forEach((p) => {
          const li = document.createElement("li");
          const me = p.clientId === myClientId ? " ← 나" : "";
          const playing = state.status === "playing";
          const score = " [누적 " + (p.sessionScore || 0) + "]";
          const cnt = playing
            ? " (남은 " + (p.handCount || 0) + "장, 획득 " + (p.trickCount || 0) + "트릭)"
            : (p.isReady ? " [준비]" : " [대기]");
          li.textContent = (p.isHost ? "[방장] " : "") + (p.isBot ? "[봇] " : "") + p.nickname
            + score
            + cnt
            + formatReconnectRemain(p, state)
            + me;
          $("players").appendChild(li);
        });
      }

      // 끊긴 사람 카운트다운을 1초마다 갱신
      setInterval(() => {
        if (latestState && latestState.players &&
            latestState.players.some((p) => !p.connected && !p.isBot)) {
          renderPlayerList(latestState);
        }
      }, 1000);

      function renderState(state) {
        latestState = state;
        renderTable(state);
        $("roomStatus").textContent = state.status;
        $("playerCount").textContent = state.players.length;
        renderPlayerList(state);

        // 방장 전용 버튼들: 내가 방장이고 대기 중일 때만 표시
        const iAmHost = state.hostClientId === myClientId;
        const waiting = state.status === "waiting";
        if (waiting) {
          $("resultArea").classList.add("hidden");
          $("startedBanner").classList.add("hidden");
        }
        const startBtn = $("startBtn");
        const resetBtn = $("resetScoresBtn");
        const shuffleBtn = $("shuffleSeatsBtn");
        if (iAmHost && waiting) {
          startBtn.classList.remove("hidden");
          startBtn.disabled = !state.canStart;
          resetBtn.classList.remove("hidden");
          shuffleBtn.classList.remove("hidden");
        } else {
          startBtn.classList.add("hidden");
          resetBtn.classList.add("hidden");
          shuffleBtn.classList.add("hidden");
        }
        $("readyBtn").disabled = !waiting;
      }

      $("createBtn").addEventListener("click", () => {
        sendMsg("create_room", { nickname: $("nickname").value, password: $("password").value });
      });
      $("joinBtn").addEventListener("click", () => {
        sendMsg("join_room", {
          roomId: $("roomId").value.toUpperCase(),
          nickname: $("nickname").value,
          password: $("password").value,
        });
      });
      $("leaveBtn").addEventListener("click", () => {
        intentionalLeave = true;
        myToken = null;
        if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
        sendMsg("leave_room", {});
        $("startedBanner").classList.add("hidden");
        exitRoomView();
      });
      $("pingBtn").addEventListener("click", () => {
        sendMsg("ping_from_client", { message: "hello from browser" });
      });
      $("readyBtn").addEventListener("click", () => sendMsg("ready", {}));
      $("startBtn").addEventListener("click", () => sendMsg("start_game", {}));
      $("shuffleSeatsBtn").addEventListener("click", () => sendMsg("shuffle_seats", {}));
      $("resetScoresBtn").addEventListener("click", () => {
        if (confirm("누적 점수를 모두 0으로 초기화할까요?")) sendMsg("reset_scores", {});
      });
      $("lobbyBtn").addEventListener("click", () => sendMsg("return_to_lobby", {}));
      $("discardKittyBtn").addEventListener("click", () => {
        if (discardSelected.length !== 3) return;
        sendMsg("discard_kitty", { cardIds: discardSelected.slice() });
      });

      // 입찰
      $("bidBtn").addEventListener("click", () => {
        const trump = $("bidTrump").value;
        const noTrump = trump === "NT";
        sendMsg("bid", {
          targetScore: parseInt($("bidScore").value, 10),
          trumpSuit: noTrump ? null : trump,
          noTrump,
        });
      });
      $("passBidBtn").addEventListener("click", () => sendMsg("pass_bid", {}));
      $("dealMissBtn").addEventListener("click", () => sendMsg("declare_deal_miss", {}));

      // 프렌드 선택
      $("friendMightyBtn").addEventListener("click", () =>
        sendMsg("choose_friend", { friendCardId: latestState ? latestState.mightyCardId : "S_A" }));
      $("friendJokerBtn").addEventListener("click", () =>
        sendMsg("choose_friend", { friendCardId: "JOKER" }));
      $("friendNoneBtn").addEventListener("click", () =>
        sendMsg("choose_friend", { friendCardId: "NONE" }));
      $("friendCustomBtn").addEventListener("click", () => {
        const id = $("friendCard").value.trim().toUpperCase();
        if (!id) { log("[warn] 카드 id를 입력하세요"); return; }
        sendMsg("choose_friend", { friendCardId: id });
      });
    </script>
  </body>
</html>
