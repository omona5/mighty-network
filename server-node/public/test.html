<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mighty 서버 Ping-Pong 테스트 (WebSocket)</title>
    <style>
      body {
        font-family: -apple-system, sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 0 20px;
        background: #1a1a2e;
        color: #eee;
      }
      h1 {
        font-size: 20px;
      }
      #status {
        padding: 10px;
        border-radius: 8px;
        background: #16213e;
        margin: 10px 0;
      }
      button {
        font-size: 16px;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        background: #0f3460;
        color: #fff;
        cursor: pointer;
      }
      button:hover {
        background: #533483;
      }
      #log {
        margin-top: 16px;
        padding: 10px;
        background: #0f1626;
        border-radius: 8px;
        height: 200px;
        overflow-y: auto;
        font-family: monospace;
        font-size: 13px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Mighty 서버 Ping-Pong 테스트 (WebSocket)</h1>
    <div id="status">연결 상태: 대기 중...</div>
    <button id="pingBtn">Ping 보내기</button>
    <div id="log"></div>

    <script>
      const statusEl = document.getElementById("status");
      const logEl = document.getElementById("log");
      const pingBtn = document.getElementById("pingBtn");

      function log(msg) {
        logEl.textContent += msg + "\n";
        logEl.scrollTop = logEl.scrollHeight;
      }

      // 순수 WebSocket으로 같은 서버에 접속한다. (http -> ws)
      const wsUrl = "ws://" + location.host;
      const socket = new WebSocket(wsUrl);

      socket.addEventListener("open", () => {
        statusEl.textContent = "연결 상태: 접속됨";
        log("[open] 서버에 접속했습니다: " + wsUrl);
      });

      socket.addEventListener("close", () => {
        statusEl.textContent = "연결 상태: 끊김";
        log("[close] 연결이 끊겼습니다.");
      });

      socket.addEventListener("error", () => {
        log("[error] 연결 오류. 서버가 켜져 있는지 확인하세요.");
      });

      // 서버가 보내는 메시지를 받는다.
      socket.addEventListener("message", (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === "pong_from_server") {
          log("[pong] 서버 응답: " + JSON.stringify(msg.data));
        } else {
          log("[recv] " + event.data);
        }
      });

      // 버튼을 누르면 ping 메시지를 보낸다.
      pingBtn.addEventListener("click", () => {
        if (socket.readyState !== WebSocket.OPEN) {
          log("아직 접속되지 않았습니다.");
          return;
        }
        const payload = {
          type: "ping_from_client",
          data: { message: "hello from browser" },
        };
        socket.send(JSON.stringify(payload));
        log("[ping] 서버로 전송: " + JSON.stringify(payload));
      });
    </script>
  </body>
</html>
